<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth & RBAC Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-6">Auth & RBAC Portal</h1>

        <!-- Auth Tabs -->
        <div class="flex border-b border-slate-700 mb-6" id="authTabs">
            <button onclick="switchTab('login')" id="loginTabBtn" class="w-1/2 py-2 text-center font-semibold border-b-2 border-blue-500 text-blue-400">Login</button>
            <button onclick="switchTab('register')" id="registerTabBtn" class="w-1/2 py-2 text-center font-semibold text-slate-400 border-b-2 border-transparent">Register</button>
        </div>

        <!-- Notification Box -->
        <div id="alertBox" class="hidden p-3 mb-4 rounded text-sm font-medium"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-slate-300">Email</label>
                <input type="email" id="loginEmail" required class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-300">Password</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-semibold transition">Login</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-sm mb-1 text-slate-300">Full Name</label>
                <input type="text" id="regName" required class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-300">Email</label>
                <input type="email" id="regEmail" required class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-300">Password</label>
                <input type="password" id="regPassword" required class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-300">Role</label>
                <select id="regRole" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                    <option value="VIEWER">VIEWER</option>
                    <option value="EMERGENCY_OFFICER">EMERGENCY_OFFICER</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-500 py-2 rounded font-semibold transition">Register</button>
        </form>

        <!-- Dashboard Section (Shown when Logged In) -->
        <div id="dashboard" class="hidden space-y-4">
            <div class="bg-slate-700 p-4 rounded text-sm">
                <p class="text-slate-300">Status: <span class="text-green-400 font-bold">Logged In</span></p>
                <p class="text-slate-300 mt-1">Access Token Active</p>
            </div>
            
            <button onclick="testOfficerAction()" class="w-full bg-purple-600 hover:bg-purple-500 py-2 rounded font-semibold transition">
                Test Restricted Officer Action
            </button>
            
            <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-500 py-2 rounded font-semibold transition">
                Logout
            </button>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        function switchTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const registerForm = document.getElementById("registerForm");
            const loginTabBtn = document.getElementById("loginTabBtn");
            const registerTabBtn = document.getElementById("registerTabBtn");

            if (tab === 'login') {
                loginForm.classList.remove("hidden");
                registerForm.classList.add("hidden");
                loginTabBtn.className = "w-1/2 py-2 text-center font-semibold border-b-2 border-blue-500 text-blue-400";
                registerTabBtn.className = "w-1/2 py-2 text-center font-semibold text-slate-400 border-b-2 border-transparent";
            } else {
                registerForm.classList.remove("hidden");
                loginForm.classList.add("hidden");
                registerTabBtn.className = "w-1/2 py-2 text-center font-semibold border-b-2 border-green-500 text-green-400";
                loginTabBtn.className = "w-1/2 py-2 text-center font-semibold text-slate-400 border-b-2 border-transparent";
            }
        }

        function showAlert(message, isError = false) {
            const alertBox = document.getElementById("alertBox");
            alertBox.classList.remove("hidden", "bg-red-500/20", "text-red-300", "bg-green-500/20", "text-green-300");
            if (isError) {
                alertBox.classList.add("bg-red-500/20", "text-red-300", "border", "border-red-500");
            } else {
                alertBox.classList.add("bg-green-500/20", "text-green-300", "border", "border-green-500");
            }
            alertBox.innerText = message;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const data = {
                full_name: document.getElementById("regName").value,
                email: document.getElementById("regEmail").value,
                password: document.getElementById("regPassword").value,
                role: document.getElementById("regRole").value
            };

            const res = await fetch(`${API_URL}/auth/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (res.ok) {
                showAlert("Registration successful! Please login.");
                switchTab('login');
            } else {
                showAlert(result.detail || "Registration failed", true);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append("username", document.getElementById("loginEmail").value);
            formData.append("password", document.getElementById("loginPassword").value);

            const res = await fetch(`${API_URL}/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });
            const result = await res.json();

            if (res.ok) {
                localStorage.setItem("token", result.access_token);
                showDashboard();
                showAlert("Logged in successfully!");
            } else {
                showAlert(result.detail || "Login failed", true);
            }
        }

        async function testOfficerAction() {
            const token = localStorage.getItem("token");
            const res = await fetch(`${API_URL}/auth/officer-only-action`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` }
            });
            const result = await res.json();

            if (res.ok) {
                showAlert(`Success (200): ${result.message || JSON.stringify(result)}`);
            } else {
                showAlert(`Access Denied (${res.status}): ${result.detail}`, true);
            }
        }

        function showDashboard() {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("registerForm").classList.add("hidden");
            document.getElementById("authTabs").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
        }

        function logout() {
            localStorage.removeItem("token");
            location.reload();
        }

        if (localStorage.getItem("token")) {
            showDashboard();
        }
    </script>
</body>
</html>
